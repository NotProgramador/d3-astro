# Supabase local dev config for Domingos de Dibujar / Tinta estuvo aquí
# Generated to match `supabase init` defaults; adjust ports if they collide.

project_id = "d3-tinta-estuvo-aqui"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:4321"
additional_redirect_urls = ["http://localhost:4321"]
jwt_expiry = 3600
enable_signup = false

[functions.unlock-node]
verify_jwt = false

[functions.create-explorer]
verify_jwt = false

[functions.recover-by-code]
verify_jwt = false

[functions.attach-recovery-email]
verify_jwt = false

[functions.send-recovery-email]
verify_jwt = false

[functions.rotate-node-key]
verify_jwt = false

[analytics]
enabled = false
