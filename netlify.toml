# Netlify config — Astro estático (Domingos de Dibujar).
# NO añadir adapter SSR; toda la lógica sensible corre en Supabase Edge Functions.
# Sólo variables PUBLIC_* van al bundle del navegador. NO poner service_role,
# NO poner TINTAMAP_PEPPER, NO poner RESEND_API_KEY en Netlify.

[build]
  command = "npm run build"
  publish = "dist"

# Compatibilidad de Node con las deps declaradas (Astro 4.x, supabase-js v2).
[build.environment]
  NODE_VERSION = "20"

# Cache razonable para assets versionados por Astro (_astro/*).
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# El HTML se cachea corto para que updates de contenido/lógica lleguen rápido.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
